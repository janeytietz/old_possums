<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Old Possum</title>
  <!-- The scene window for the Mac app's floating panel (mac/). It shows what
       the main window's timer is doing; its buttons ask the main window. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Texturina:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fondamento&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/scene.css" />
  <script type="module" src="js/widget.js"></script>
</head>
<body class="widget" data-backdrop="parchment">
  <svg class="ink-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <filter id="ink" x="-6%" y="-10%" width="112%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="hand" x="-2%" y="-12%" width="104%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>
  <header class="w-band">
    <span class="w-title"><span class="initial">O</span>ld Possum’s Book of Productivity</span>
    <button id="wOpen" class="link-btn" type="button">Open the app</button>
  </header>
  <img class="w-vine" src="assets/art/margins/bottom-sprig.png" alt="" />
  <svg id="wBuddy" class="widget-buddy" role="img" aria-label="Your possum at its desk"></svg>
  <section class="w-clock" aria-label="Timer">
    <p id="wPhase" class="w-phase">Focus</p>
    <p id="wTime" class="w-time" role="timer">25:00</p>
    <p id="wTask" class="w-task">Ready when you are</p>
    <div class="w-buttons">
      <button id="wToggle" class="ink-btn main" type="button">Start focus</button>
      <button id="wSkip" class="ink-btn" type="button" aria-label="Skip to the next phase">Skip</button>
    </div>
    <p id="wBuddies" class="w-buddies"></p>
  </section>
  <span class="w-frame" aria-hidden="true"></span>
</body>
</html>
